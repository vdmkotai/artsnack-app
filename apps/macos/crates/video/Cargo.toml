[package]
name = "artsnack-video"
description = "Video playback: AVFoundation on macOS, decoding into CoreVideo frames GPUI draws with surface(). No GPUI dependency, so it builds alone for the Mac target."
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSString",
  "NSURL",
  "NSDictionary",
  "NSValue",
  "NSObject",
] }
objc2-av-foundation = { version = "0.3", features = [
  "AVPlayer",
  "AVPlayerItem",
  "AVPlayerItemOutput",
  "AVAsset",
  "AVTime",
  "objc2-core-media",
  "objc2-core-video",
] }
objc2-core-media = { version = "0.3", features = ["CMTime"] }
objc2-core-video = { version = "0.3.2", features = [
  "CVBuffer",
  "CVImageBuffer",
  "CVPixelBuffer",
  "CVHostTime",
  "CVBase",
  "CVReturn",
] }
objc2-core-foundation = { version = "0.3.2", features = ["CFString", "CFDictionary", "CFNumber"] }
