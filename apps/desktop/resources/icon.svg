<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: the artwork occupies the 824px square at (100,100). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26241f"/>
      <stop offset="1" stop-color="#14130f"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ec4899" stop-opacity="0.08"/>
